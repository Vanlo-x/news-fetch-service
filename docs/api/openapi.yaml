openapi: 3.0.3
info:
  title: news-fetch-service API
  version: 0.0.1
  description: API for fetching normalized news from configured RSS sources.
paths:
  /health:
    get:
      summary: Service health check
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/news/fetch:
    post:
      summary: Fetch news from configured RSS sources
      description: Fetches selected enabled RSS sources concurrently, parses RSS/Atom feeds, and returns normalized NewsItem records. The HTTP status only indicates request handling; aggregate business outcome is reported as OK, PARTIAL, or FAILED in the response body. Source-level retry, one-level fallback, in-memory source cache, request-local deduplication, deterministic sorting, and in-memory source status are supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchNewsRequest"
      responses:
        "200":
          description: Fetch response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchNewsResponse"
        "400":
          description: Request validation failed, or request body is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /v1/news/sources/status:
    get:
      summary: List configured source statuses
      responses:
        "200":
          description: Source status list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceStatus"
  /v1/news/sources/{sourceId}/status:
    get:
      summary: Get one configured source status
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceStatus"
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    FetchNewsRequest:
      type: object
      description: All filters are optional. Missing or empty sourceIds means all enabled RSS sources.
      properties:
        sourceIds:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: "^[A-Za-z0-9_-]+$"
        category:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        language:
          type: string
          pattern: "^[a-z]{2}$"
          description: Lowercase ISO 639 language code, such as zh or en.
        region:
          type: string
          pattern: "^[A-Z]{2}$"
          description: Uppercase ISO 3166 region code, such as CN or US.
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
    FetchNewsResponse:
      type: object
      required:
        - status
        - items
        - errors
      properties:
        status:
          type: string
          enum:
            - OK
            - PARTIAL
            - FAILED
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FetchError"
    NewsItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        sourceId:
          type: string
        sourceName:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        fetchedAt:
          type: string
          format: date-time
        summary:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        fingerprint:
          type: string
        qualityScore:
          type: number
          format: double
          nullable: true
        raw:
          type: object
          additionalProperties: true
    FetchError:
      type: object
      properties:
        sourceId:
          type: string
        stage:
          type: string
          example: FETCH
        code:
          type: string
          enum:
            - CONNECT_TIMEOUT
            - READ_TIMEOUT
            - HTTP_CLIENT_ERROR
            - HTTP_IO_ERROR
            - HTTP_INTERRUPTED
            - RESPONSE_TOO_LARGE
            - UNSAFE_URL
            - UNSUPPORTED_HTTP_METHOD
            - HTTP_STATUS
            - RSS_PARSE_ERROR
            - SOURCE_FETCH_EXCEPTION
            - SOURCE_NOT_FOUND
            - SOURCE_DISABLED
            - UNSUPPORTED_SOURCE_TYPE
          example: HTTP_STATUS
        message:
          type: string
        retryable:
          type: boolean
        occurredAt:
          type: string
          format: date-time
    SourceStatus:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        sourceType:
          type: string
          enum:
            - RSS
            - API
            - HTML
        enabled:
          type: boolean
        health:
          type: string
          enum:
            - UNKNOWN
            - OK
            - DEGRADED
            - FAILED
            - DISABLED
        lastFetchAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        lastFailureAt:
          type: string
          format: date-time
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
        lastErrorMessage:
          type: string
          nullable: true
        lastItemCount:
          type: integer
          format: int32
        lastDurationMs:
          type: integer
          format: int64
        lastCacheHit:
          type: boolean
        lastStaleCacheHit:
          type: boolean
        lastCacheAgeSeconds:
          type: integer
          format: int64
          nullable: true
        lastCacheRefreshedAt:
          type: string
          format: date-time
          nullable: true
        lastFallbackUsed:
          type: boolean
        lastResolvedSourceId:
          type: string
          nullable: true
    ApiErrorResponse:
      type: object
      required:
        - status
        - message
        - errors
      properties:
        status:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Request validation failed
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiFieldError"
    ApiFieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: limit
        message:
          type: string
          example: must be less than or equal to 100
